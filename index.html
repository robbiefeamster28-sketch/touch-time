<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Touch Time – Soccer Drills</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1efe4;--card:#fff;--ink:#12301f;--mute:#5d7365;--line:#d5d8c8;--accent:#12301f;--onaccent:#f1efe4;--gold:#e0b400;--turf:#2f7d4a;--turf2:#2a7144;--chalk:rgba(255,255,255,.75);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2217;--card:#143324;--ink:#f1efe4;--mute:#9db4a5;--line:#244836;--accent:#f2d13b;--onaccent:#0d2217;--gold:#f2d13b}}
:root[data-theme="dark"]{--bg:#0d2217;--card:#143324;--ink:#f1efe4;--mute:#9db4a5;--line:#244836;--accent:#f2d13b;--onaccent:#0d2217;--gold:#f2d13b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.big{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
h1{font-size:34px;line-height:1}
.lvl{text-align:right;font-size:14px;color:var(--mute)}
.lvl b{display:block;font:700 22px "Barlow Condensed",sans-serif;color:var(--ink)}
.xp{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 18px}
.xp i{display:block;height:100%;background:var(--gold);width:0;transition:width .6s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .big{font-size:30px;line-height:1}.stat span{font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:10px 2px;font-size:15px;border:1px solid var(--line);background:transparent;border-radius:8px;font-weight:600}
.tab[aria-selected=true]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{padding:8px 14px;border:1px solid var(--line);background:var(--card);border-radius:20px;font-weight:600}.chip[aria-pressed=true]{background:var(--gold);color:#12301f;border-color:var(--gold)}
.drill{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.drill .em{font-size:28px;width:44px;height:44px;display:grid;place-items:center;background:var(--bg);border-radius:8px}
.drill h3{font-size:22px;line-height:1.1}.drill small{color:var(--mute)}
.drill .t{margin-left:auto;font-size:13px;color:var(--mute);text-align:right;white-space:nowrap}
.needs{margin:0 0 16px;padding-left:20px}.need{font-size:22px;margin:12px 0 4px}.vctl{display:flex;gap:8px;margin-bottom:8px}.vctl input[type=url]{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}.vctl .ghost{padding:10px 16px;cursor:pointer;white-space:nowrap}video.pitch{background:#000;max-height:60vh}.dd{display:block;color:var(--mute);font-size:14px;line-height:1.3;margin-top:2px}.drill>span:nth-child(2){min-width:0;flex:1}
.row{display:flex;gap:6px;align-items:stretch;margin-bottom:8px}.row .drill{margin-bottom:0;flex:1;min-width:0}.star{background:var(--card);border:1px solid var(--line);border-radius:10px;width:46px;font-size:24px;color:var(--gold);padding:0}.detail h2 .star{width:auto;border:0;background:none;font-size:30px;padding:0 0 0 8px;vertical-align:middle}
.srch{width:100%;padding:10px 12px;margin:0 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}h3.grp{font-size:17px;color:var(--mute);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.back{background:none;border:0;padding:6px 0;margin-bottom:6px;color:var(--mute);font-weight:600}
.pitch{width:100%;border-radius:10px;display:block;background:var(--turf)}
.cap{font-size:13px;color:var(--mute);margin:6px 0 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cap a{color:var(--ink)}
.detail h2{font-size:34px;line-height:1}
.detail p{margin:8px 0 16px}
.steps{padding-left:20px;margin:0 0 18px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pick button{padding:12px 0;border:1px solid var(--line);background:var(--card);border-radius:8px;font:700 22px "Barlow Condensed",sans-serif}
.pick button[aria-pressed=true]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.go{width:100%;padding:16px;border:0;border-radius:10px;background:var(--gold);color:#12301f;font:700 26px "Barlow Condensed",sans-serif;letter-spacing:.03em}
.timer{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.timer.on{display:flex}
.ring{position:relative;width:260px;height:260px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font:700 92px "Barlow Condensed",sans-serif}
.ghost{padding:12px 28px;border:1px solid var(--line);background:transparent;border-radius:8px;font-weight:600}
.done{text-align:center}.done .big{font-size:56px}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center}
.badge .em{font-size:28px}.badge.lock{opacity:.45;filter:grayscale(1)}
.badge b{display:block;font:700 19px "Barlow Condensed",sans-serif;line-height:1.1}.badge small{color:var(--mute)}
h2.sec{font-size:24px;margin:18px 0 8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--accent);color:var(--onaccent);padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.3s;z-index:30;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div class="timer" id="timer" role="dialog" aria-label="Drill timer"></div>
<div class="toast" id="toast" role="status"></div>
<script>
var DRILLS=[
{id:"weave",k:"dribbling",n:"Cone weave",e:"🔺",lv:"Beginner",d:"Dribble through a line of cones using small touches, keeping the ball close to your feet and your head up.",s:["Set 5 cones in a line, 1 m apart.","Use the inside and outside of both feet.","Keep touches soft; speed up as you get comfortable."],c:[[50,90],[100,90],[150,90],[200,90],[250,90]],p:"M20 90 Q50 60 75 90 T125 90 T175 90 T225 90 T275 90"},
{id:"fig8",k:"dribbling",n:"Figure-8 dribble",e:"♾️",lv:"Beginner",d:"Circle two cones in a figure-8 pattern to build close control and sharp changes of direction.",s:["Place 2 cones 2 m apart.","Dribble around both in a continuous 8.","Switch direction every 30 seconds."],c:[[70,90],[230,90]],p:"M150 90 C190 30 250 40 250 90 C250 140 190 150 150 90 C110 30 50 40 50 90 C50 140 110 150 150 90 Z"},
{id:"toe",k:"dribbling",n:"Toe taps",e:"👟",lv:"Beginner",d:"Alternate tapping the top of the ball with the sole of each foot to build rhythm and balance.",s:["Stand with the ball in front of you.","Tap the top of the ball left, right, left, right.","Stay light on your standing foot."],c:[],p:"M130 110 L170 110 L130 110"},
{id:"wall",k:"passing",n:"Wall passes",e:"🧱",lv:"Intermediate",d:"Pass against a wall and control the rebound first time. Great for passing accuracy and first touch.",s:["Stand 3 m from a wall.","Pass with the inside of your foot, then trap the return.","Alternate feet every few passes."],c:[[150,150]],p:"M150 150 L150 38 L150 150"},
{id:"tri",k:"passing",n:"Triangle passing",e:"🔺",lv:"Intermediate",d:"Move the ball around a triangle of cones with quick touches and sharp turns at each corner.",s:["Set 3 cones in a triangle, 4 m apart.","Dribble to each cone and turn quickly.","Change direction each round."],c:[[60,140],[150,40],[240,140]],p:"M60 140 L150 40 L240 140 L60 140"},
{id:"jug",k:"juggling",n:"Juggling",e:"🤹",lv:"Advanced",d:"Keep the ball in the air using feet, thighs and shoulders. Start by counting touches and beat your best.",s:["Drop the ball onto your laces.","Keep each touch low and controlled.","Let it bounce once if you need to reset."],c:[],p:"M150 150 L150 50 L150 150"},
{id:"target",k:"passing",n:"Target passing",e:"🎯",lv:"Beginner",d:"Pass accurately through a gate of two cones, using the inside of your foot. Focus on a firm, straight pass.",s:["Set 2 cones 1 m apart as a gate, 8 m away.","Pass through the gate with the inside of your foot.","Step back each time you hit 5 in a row."],c:[[140,40],[160,40]],p:"M60 150 L150 40 L240 150"},
{id:"shoot",k:"finishing",n:"Target shooting",e:"🥅",lv:"Intermediate",d:"Strike the ball at the corners of the goal, focusing on placement and a clean strike with your laces.",s:["Place the ball 10 m from the goal.","Aim for the bottom corners first.","Plant your standing foot beside the ball and follow through."],c:[],p:"M150 150 L70 24 L150 150"},
{id:"onetouch",k:"finishing",n:"One-touch finish",e:"⚡",lv:"Advanced",d:"Receive a pass from the side and finish first time. Builds quick reactions and composure in front of goal.",s:["Roll or pass the ball in from the side.","Take one touch to set, or hit it first time.","Finish low, across the keeper."],c:[[40,130]],p:"M40 130 L150 100 L220 24 L150 100 L40 130"},
{id:"shuffle",k:"goalkeeper",n:"Shuffle and dive",e:"🧤",lv:"Intermediate",d:"Shuffle side to side between two cones, then dive to save. Builds footwork and agility.",s:["Place 2 cones 4 m apart in front of the goal.","Shuffle side to side without crossing your feet.","Finish each round with a low dive."],c:[[90,40],[210,40]],p:"M90 40 L210 40 L90 40"},
{id:"catch",k:"goalkeeper",n:"Catch and throw",e:"🙌",lv:"Beginner",d:"Catch the ball with soft hands, then roll or throw it accurately to a target. Great for handling and distribution.",s:["Toss the ball up or have a partner throw it.","Catch with fingers spread, thumbs together behind the ball.","Roll or throw to a cone target."],c:[[240,140]],p:"M150 90 L150 40 L150 90 L240 140 L150 90"}];
var BADGES=[[1,"First touch","⚽"],[5,"Warm-up","🔥"],[15,"Fifteen club","🥉"],[30,"Half hour hero","🥈"],[60,"Hour player","🥇"],[120,"Two-hour grinder","💪"],[300,"Five-hour legend","🏆"],[600,"Ten-hour icon","👑"]];
var LNAMES=["Rookie","Academy","Second team","Starter","World class"];var DAILY_GOAL=30;var INVID={weave:"In this video, I dribble through five cones set in a line, 1 m apart, using the inside and outside of both feet. I keep my touches small and my head up, then turn at the end and weave back.",fig8:"In this video, I dribble around two cones in a continuous figure-8, keeping the ball tight to my feet. I stay low through the turns and switch direction halfway through.",toe:"In this video, I stand over the ball and tap the top of it with the sole of each foot: left, right, left, right. I stay light on my standing foot and keep a steady rhythm.",jug:"In this video, I keep the ball in the air with my laces, thighs, and shoulders while counting my touches. I keep each touch low and controlled, and I let the ball bounce once to reset when I need to.",wall:"In this video, I stand about 3 m from a wall and pass with the inside of my foot, then trap the rebound. I switch feet every few passes.",tri:"In this video, I dribble around a triangle of three cones, 4 m apart, turning sharply at each one. I change direction after every round.",target:"In this video, I pass the ball through a gate made of two cones, 8 m away, using the inside of my foot. Each time I hit five in a row, I step back.",shoot:"In this video, I place the ball 10 m from the goal and strike at the bottom corners with my laces. I plant my standing foot beside the ball and follow through.",onetouch:"In this video, a pass rolls in from the side and I finish first time, low and across the goal. I stay balanced and keep my eyes on the ball until I strike it.",shuffle:"In this video, I shuffle side to side between two cones in front of the goal without crossing my feet. I finish each round with a low dive.",catch:"In this video, I toss the ball up and catch it with soft hands, fingers spread and thumbs together behind the ball. Then I roll it to a cone target."};var NEEDS={weave:["Soccer ball","5 cones (or water bottles or shoes)","About 6 m of flat space"],fig8:["Soccer ball","2 cones or markers","Flat space about 4 m × 3 m"],toe:["Soccer ball","A small flat area","Comfortable shoes or cleats"],jug:["Soccer ball that fits your size","Open space, grass or hard floor","Cleats or flat-soled shoes"],wall:["Soccer ball","A solid wall or rebounder","About 3 m of clear space"],tri:["Soccer ball","3 cones","Flat space about 4 m × 4 m"],target:["Soccer ball","2 cones for the gate","8 m of open space"],shoot:["Soccer ball (a few if you have them)","A goal, or 2 cones as posts","About 10 m of space"],onetouch:["2 or more soccer balls","A goal, or 2 cones as posts","A partner or wall to pass the ball in (optional)"],shuffle:["2 cones","A goal or marked area","Goalkeeper gloves (optional)","Soft ground or a mat for diving"],catch:["Soccer ball","Goalkeeper gloves (recommended)","A cone as a target","A partner (optional)"]};
var WEEKLY_GOAL=210;var TOPICS=[["fav","★ Favorites"],["dribbling","Dribbling"],["passing","Passing"],["finishing","Finishing"],["goalkeeper","Goalkeeper"],["juggling","Juggling"]];
var log=[],sel=30,view="practices",open=null,tm=null,topic="dribbling",pr=null,pc=null,favs=[],ts=null,tres=[],tc=null,tk="dribbling",TCATS=[["dribbling","Dribbling"],["juggling","Juggling"],["wall","Wall work"],["goalkeeper","Goalkeeper"]];
try{log=JSON.parse(localStorage.getItem("touchtime.log")||"[]")}catch(e){log=[]}
function save(){try{localStorage.setItem("touchtime.log",JSON.stringify(log))}catch(e){}}
function $(i){return document.getElementById(i)}
function startOfWeek(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function startOfDay(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}function startOfMonth(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).getTime()}
function sum(from,id){return log.reduce(function(a,x){return a+(x.t>=from&&(!id||x.d===id)?x.s:0)},0)}
function fmt(s){s=Math.round(s);if(s>=3600){var h=Math.floor(s/3600),mm=Math.floor(s%3600/60);return h+"h"+(mm?" "+mm+"m":"")}var m=Math.floor(s/60),r=s%60;return m?m+"m"+(r?" "+r+"s":""):r+"s"}
function monthGoal(){var d=new Date();return DAILY_GOAL*new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
function lvl(mSec){var g=monthGoal()*60,i=0;for(var k=1;k<=4;k++){if(mSec>=g*k/4)i=k}var lo=g*i/4,hi=g*(i+1)/4;return{i:i,name:LNAMES[i],next:i<4?LNAMES[i+1]:null,need:Math.max(0,hi-mSec),pct:i<4?(mSec-lo)/(hi-lo)*100:100}}
function toast(m){var t=$("toast");t.textContent=m;t.className="toast on";setTimeout(function(){t.className="toast"},3200)}
function pitch(d){
var cones=d.c.map(function(c){return '<polygon points="'+(c[0]-7)+','+(c[1]+7)+' '+(c[0]+7)+','+(c[1]+7)+' '+c[0]+','+(c[1]-9)+'" fill="#f08a24"/>'}).join("");
var wall=(d.k==="wall"||d.id==="wall"||/^(p(1|2|l)|q|iw)_/.test(d.id))?'<rect x="90" y="18" width="120" height="10" fill="#c9c3ad"/>':"";var goal=(d.k==="finishing"||d.k==="goalkeeper"||d.k==="shooting")?'<rect x="90" y="8" width="120" height="14" fill="rgba(255,255,255,.15)" stroke="#fff" stroke-width="3"/>':"";
return '<svg class="pitch" viewBox="0 0 300 180" role="img" aria-label="Animated demo of '+d.n+'"><g stroke="rgba(255,255,255,.7)" fill="none" stroke-width="2"><rect x="6" y="6" width="288" height="168"/><line x1="150" y1="6" x2="150" y2="174" opacity=".3"/><circle cx="150" cy="90" r="30" opacity=".3"/></g>'+wall+goal+'<path d="'+d.p+'" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-dasharray="4 5"/>'+cones+'<circle r="8" fill="#fff" stroke="#111" stroke-width="1.5"><animateMotion dur="'+(d.dur||(d.id==="toe"?"0.8":d.id==="jug"?"1.4":"4"))+'s" repeatCount="indefinite" path="'+d.p+'"/></circle></svg>'}
function render(){
var tot=sum(0),wk=sum(startOfWeek()),mo=sum(startOfMonth()),dy=sum(startOfDay()),L=lvl(mo);
var h=hdr(L);
h+='<div class="xp" aria-label="Progress to next level"><i style="width:'+L.pct+'%"></i></div>';
if(bld){h+=bldView()}else if(ts){h+=testView()}else if(!open&&pr){h+=practiceView()}else if(open){var d=DRILLS.filter(function(x){return x.id===open})[0];
h+='<div class="detail"><button class="back" onclick="backDrill()">‹ '+(pr?"Back to practice":"All drills")+'</button>'+media(d)+
vidBar(d)+
'<h2>'+d.n+starBtn(d)+'</h2><p>'+d.d+'</p><h3 class="need">In the video</h3><p>'+(INVID[d.id]||"")+'</p><h3 class="need">What you need</h3><ul class="needs">'+(NEEDS[d.id]||[]).map(function(x){return"<li>"+x+"</li>"}).join("")+'</ul><h3 class="need">How to do it</h3><ol class="steps">'+d.s.map(function(s){return"<li>"+s+"</li>"}).join("")+'</ol>'+
'<div class="pick">'+[30,60,90].map(function(s){return'<button aria-pressed="'+(sel===s)+'" onclick="sel='+s+';render()">'+(s===60?"1 min":s===90?"90 sec":"30 sec")+'</button>'}).join("")+'</div>'+
'<button class="go" onclick="startDrill()">Do drill</button><p style="color:var(--mute);font-size:14px">You’ve put in '+fmt(sum(0,d.id))+' on this drill.</p></div>';
}else{
h+='<div class="stats"><div class="stat"><div class="big">'+fmt(wk)+'</div><span>This week</span></div><div class="stat"><div class="big">'+fmt(mo)+'</div><span>This month</span></div><div class="stat"><div class="big">'+fmt(tot)+'</div><span>All time</span></div></div>';
h+='<div class="tabs" role="tablist"><button class="tab" data-v="practices" role="tab" aria-selected="'+(view==="practices")+'" onclick="sv(this.dataset.v)">Practices</button><button class="tab" role="tab" aria-selected="'+(view==="drills")+'" onclick="view=\'drills\';render()">Drills</button><button class="tab" data-v="tests" role="tab" aria-selected="'+(view==="tests")+'" onclick="sv(this.dataset.v)">Tests</button><button class="tab" role="tab" aria-selected="'+(view==="rewards")+'" onclick="view=\'rewards\';render()">Rewards</button></div>';
if(view==="practices"){h+=practiceList()}else if(view==="tests"){h+=testList()}else if(view==="drills"){h+=drillsView()}else if(0){h+='<div class="chips">'+TOPICS.map(function(t){return'<button class="chip" aria-pressed="'+(topic===t[0])+'" onclick="topic=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join("")+'</div>';if(topic==="fav"&&!favs.length)h+='<p style="color:var(--mute)">Tap the ☆ on any drill to add it to your favorites.</p>';h+=DRILLS.filter(inTopic).map(function(d){return'<div class="row"><button class="drill" data-id="'+d.id+'" onclick="openDrill(this.dataset.id)"><span class="em">'+d.e+'</span><span><h3>'+d.n+'</h3><small>'+d.lv+'</small><span class="dd">'+d.d+'</span></span><span class="t">'+fmt(sum(0,d.id))+'<br>total</span></button>'+starBtn(d)+'</div>'}).join("")}
else{
var gb=function(t,s,m){return'<h2 class="sec">'+t+': '+fmt(s)+' / '+fmt(m*60)+'</h2><div class="xp"><i style="width:'+Math.min(100,s/60/m*100)+'%"></i></div><p style="margin:0 0 4px;color:var(--mute)">'+(s>=m*60?"Goal reached!":fmt(m*60-s)+" to go.")+'</p>'};
h+=goalSet()+gb("Today",dy,DAILY_GOAL)+gb("This week",wk,DAILY_GOAL*7)+gb("This month",mo,monthGoal());h+=extras()+testTotals();
h+='<h2 class="sec">Monthly levels</h2><p style="margin:0 0 8px;color:var(--mute)">'+(L.next?fmt(L.need)+" until "+L.next+".":"World class this month. Keep it up!")+'</p><div class="badges">'+LNAMES.slice(1).map(function(n,k){var t=monthGoal()*60*(k+1)/4;return'<div class="badge'+(mo>=t?"":" lock")+'"><span class="em">'+["🎓","🥈","⭐","🌍"][k]+'</span><span><b>Level '+(k+1)+': '+n+'</b><small>'+fmt(t)+' this month</small></span></div>'}).join("")+'</div>';
h+='<h2 class="sec">Badges</h2><div class="badges">'+BADGES.map(function(b){var ok=tot>=b[0]*60;return'<div class="badge'+(ok?"":" lock")+'"><span class="em">'+b[2]+'</span><span><b>'+b[1]+'</b><small>'+(ok?"Earned":b[0]+" min total")+'</small></span></div>'}).join("")+'</div>'}
}
$("app").innerHTML=h;syncSoon()}
var vids={},links={};
try{links=JSON.parse(localStorage.getItem("touchtime.links")||"{}")}catch(e){links={}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}

function extras(){var tot=sum(0),best=longest(),ws=startOfWeek(),days={},tops={},tm={};log.forEach(function(x){var k=topicOf(x.d);if(k)tm[k]=(tm[k]||0)+x.s;if(x.t>=ws){days[di(x.t)]=1;if(k)tops[k]=1}});var nt=tres.filter(function(r){return r.t>=ws}).length,h='<h2 class="sec">Streak: '+streak()+' day'+(streak()==1?'':'s')+'</h2><div class="badges">'+[3,7,14,30].map(function(n){var ok=best>=n;return'<div class="badge'+(ok?'':' lock')+'"><span class="em">🔥</span><span><b>'+n+'-day streak</b><small>'+(ok?'Earned':'Best: '+best+' days')+'</small></span></div>'}).join('')+'</div><h2 class="sec">Weekly challenges</h2>'+[['Practice on 5 different days',Object.keys(days).length,5],['Try drills from 3 topics',Object.keys(tops).length,3],['Take 2 tests',nt,2]].map(function(c){var p=Math.min(c[1],c[2]);return'<p style="margin:0 0 2px"><b>'+(p>=c[2]?'✅ ':'')+c[0]+'</b> <span style="color:var(--mute)">'+p+'/'+c[2]+'</span></p><div class="xp"><i style="width:'+p/c[2]*100+'%"></i></div>'}).join('')+'<h2 class="sec">Topic mastery</h2><div class="badges">'+TOPICS.filter(function(t){return t[0]!=='fav'}).map(function(t){var m=(tm[t[0]]||0)/60,i=m>=180?3:m>=90?2:m>=30?1:0,nx=[30,90,180][i];return'<div class="badge'+(i?'':' lock')+'"><span class="em">'+['⚪','🥉','🥈','🥇'][i]+'</span><span><b>'+t[1]+'</b><small>'+fmt(m*60)+(nx?' · next at '+nx+' min':' · maxed')+'</small></span></div>'}).join('')+'</div><h2 class="sec">Avatars</h2><div class="badges" style="grid-template-columns:repeat(4,1fr)">'+AVS.map(function(a,i){var ok=tot>=a[0]*60;return'<button class="badge'+(ok?'':' lock')+'" style="justify-content:center;font-size:30px;'+(av===i?'border:2px solid var(--gold)':'')+'" data-i="'+i+'" onclick="setAv(this.dataset.i)" aria-label="Avatar '+(ok?'':'(locked) ')+a[1]+'">'+a[1]+'</button>'}).join('')+'</div><p style="color:var(--mute);margin:6px 0 0">Unlock more avatars with your total practice time.</p>';return h}

function filt(a){var s=q.trim().toLowerCase();return a.filter(function(x){return(!lvf||(x.lv||'Beginner')===lvf)&&(!s||(x.n+' '+x.d).toLowerCase().indexOf(s)>-1)})}
function lst(a,rowf){var g=function(x){return x.n.indexOf(':')>0?x.n.split(':')[0]:''},c={},last=null,o='';a.forEach(function(x){c[g(x)]=(c[g(x)]||0)+1});a.forEach(function(x){var k=g(x);if(k&&k!==last&&c[k]>1)o+='<h3 class="grp">'+k+'</h3>';last=k;o+=rowf(x)});return o||'<p style="color:var(--mute)">Nothing found.</p>'}
function chips(arr,cur,v){return'<div class="chips">'+arr.map(function(t){return'<button class="chip" aria-pressed="'+(cur===t[0])+'" data-k="'+t[0]+'" onclick="'+v+'=this.dataset.k;render()">'+t[1]+'</button>'}).join('')+'</div>'}
function ctl(){return'<input class="srch" type="search" placeholder="Search all" value="'+esc(q)+'" oninput="q=this.value;upd()" aria-label="Search"><div class="chips">'+['','Beginner','Intermediate','Advanced'].map(function(l){return'<button class="chip" aria-pressed="'+(lvf===l)+'" data-l="'+l+'" onclick="lvf=this.dataset.l;render()">'+(l||'Any level')+'</button>'}).join('')+'</div>'}
function upd(){var e=$('dl');if(e)e.innerHTML=view==='tests'?tlist():dlist()}
function dlist(){var b=q.trim()?DRILLS:DRILLS.filter(inTopic);return(topic==='fav'&&!favs.length&&!q.trim()?'<p style="color:var(--mute)">Tap the ☆ on any drill to add it to your favorites.</p>':'')+lst(filt(b),function(d){return'<div class="row"><button class="drill" data-id="'+d.id+'" onclick="openDrill(this.dataset.id)"><span class="em">'+d.e+'</span><span><h3>'+d.n+'</h3><small>'+d.lv+'</small><span class="dd">'+d.d+'</span></span><span class="t">'+fmt(sum(0,d.id))+'<br>total</span></button>'+starBtn(d)+'</div>'})}
function drillsView(){return chips(TOPICS,topic,'topic')+ctl()+'<div id="dl">'+dlist()+'</div>'}
function due(id){var l=0;tres.forEach(function(r){if(r.id===id&&r.t>l)l=r.t});return l&&Date.now()-l>12096e5}
function tlist(){var b=q.trim()?TESTS:TESTS.filter(function(t){return t.k===tk});return lst(filt(b),function(t){var s=bestOf(t.id);return'<button class="drill" data-id="'+t.id+'" onclick="ts=this.dataset.id;render();scrollTo(0,0)" style="margin-bottom:8px"><span class="em">'+t.e+'</span><span><h3>'+t.n+'</h3><small>'+t.secs+' sec · count '+t.unit+'</small><span class="dd">'+t.d+'</span></span><span class="t">'+(s==null?'—':MI[medalOf(t,s)]+' '+s)+'<br>'+(due(t.id)?'retest due':'best')+'</span></button>'})}
function testList(){return chips(TCATS,tk,'tk')+ctl()+'<div id="dl">'+tlist()+'</div>'}
function chart(t){var a=tres.filter(function(r){return r.id===t.id}).slice(-12);if(a.length<2)return'';var W=300,H=130,mx=Math.max(t.g,Math.max.apply(null,a.map(function(r){return r.sc})))*1.1,X=function(i){return 24+i*(W-36)/(a.length-1)},Y=function(v){return H-14-v/mx*(H-26)};return'<h3 class="need">Your history</h3><svg viewBox="0 0 '+W+' '+H+'" style="width:100%" role="img" aria-label="Score history">'+[[t.b,'🥉'],[t.s,'🥈'],[t.g,'🥇']].map(function(m){return'<line x1="22" x2="'+(W-6)+'" y1="'+Y(m[0])+'" y2="'+Y(m[0])+'" stroke="var(--line)" stroke-dasharray="4 4"/><text x="0" y="'+(Y(m[0])+4)+'" font-size="11">'+m[1]+'</text>'}).join('')+'<polyline fill="none" stroke="var(--gold)" stroke-width="3" points="'+a.map(function(r,i){return X(i)+','+Y(r.sc)}).join(' ')+'"/>'+a.map(function(r,i){return'<circle cx="'+X(i)+'" cy="'+Y(r.sc)+'" r="4" fill="var(--gold)"/>'}).join('')+'</svg>'}
function testView(){var t=tst(ts),b=bestOf(t.id),l=0;tres.forEach(function(r){if(r.id===t.id&&r.t>l)l=r.t});return'<button class="back" onclick="ts=null;render()">‹ All tests</button><div class="detail">'+(t.p||vids[t.id]?media(t):'')+vidBar(t)+'<h2>'+t.e+' '+t.n+'</h2><p>'+t.d+'</p>'+(t.v?'<h3 class="need">In the video</h3><p>'+t.v+'</p>':'')+(t.st?'<h3 class="need">How to do it</h3><ol class="steps">'+t.st.map(function(x){return'<li>'+x+'</li>'}).join('')+'</ol>':'')+'<h3 class="need">How to count</h3><p>'+t.how+'</p><h3 class="need">What you need</h3><ul class="needs">'+t.need.map(function(x){return'<li>'+x+'</li>'}).join('')+'</ul><h3 class="need">Medals in '+t.secs+' seconds</h3>'+(t.ag?'<p style="margin:0 0 8px;color:var(--mute)">Targets are what is considered good for a 13-year-old (bronze), a 15-year-old (silver) and a 17-year-old (gold).</p>':'')+'<div class="stats">'+[[1,t.b],[2,t.s],[3,t.g]].map(function(x){return'<div class="stat"><div class="big">'+MI[x[0]]+' '+x[1]+'</div><span>'+MN[x[0]]+'</span></div>'}).join('')+'</div><p style="color:var(--mute)">'+(b==null?'No attempts yet.':'Your best: '+b+' '+t.unit+' ('+MN[medalOf(t,b)]+')')+(due(t.id)?' · Last tested over 2 weeks ago. Time to retest!':'')+'</p>'+chart(t)+'<button class="go" onclick="startTest()">Start test</button></div>'}
function allP(){return mine.concat(PRACTICES)}
function todayP(){var d=new Date();return PRACTICES[Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)%PRACTICES.length]}
function pcard(p,tag){return'<button class="drill" data-id="'+p.id+'" onclick="pr=this.dataset.id;render();scrollTo(0,0)" style="margin-bottom:8px"><span class="em">'+(p.e||'⭐')+'</span><span>'+(tag?'<small>'+tag+'</small>':'')+'<h3>'+esc(p.n)+'</h3><span class="dd">'+esc(p.d||'')+'</span></span><span class="t">'+p.l.length+'<br>drills</span></button>'}
function practiceList(){var dy=sum(startOfDay());return'<p style="margin:0 0 10px;color:var(--mute)">'+(dy>=DAILY_GOAL*60?'Daily goal reached. 🎉':fmt(DAILY_GOAL*60-dy)+' left to hit today’s goal.')+'</p>'+pcard(todayP(),'Practice of the day')+'<button class="go" style="margin:4px 0 8px;padding:12px;font-size:22px" onclick="newP()">+ Build your own practice</button>'+(favs.length>1?'<button class="ghost" style="width:100%;margin-bottom:12px" onclick="favP()">Make a practice from my '+favs.length+' favorites</button>':'')+allP().map(function(p){return pcard(p,p.my?'My practice':'')}).join('')}
function practiceView(){var p=allP().filter(function(x){return x.id===pr})[0];if(!p){pr=null;return practiceList()}var l=p.l.filter(dr),n=l.length;return'<button class="back" onclick="pr=null;render()">‹ All practices</button><div class="detail"><h2>'+(p.e||'⭐')+' '+esc(p.n)+'</h2><p>'+esc(p.d||'')+'</p><h3 class="need">Time per drill</h3><div class="pick">'+[30,60,90].map(function(s){return'<button aria-pressed="'+(sel===s)+'" onclick="sel='+s+';render()">'+(s===60?'1 min':s===90?'90 sec':'30 sec')+'</button>'}).join('')+'</div><h3 class="need">Rest between drills</h3><div class="pick" style="grid-template-columns:repeat(4,1fr)">'+[0,10,20,30].map(function(s){return'<button aria-pressed="'+(rest===s)+'" onclick="rest='+s+';render()">'+(s?s+'s':'None')+'</button>'}).join('')+'</div><p style="color:var(--mute);margin:0 0 12px">'+n+' drills · about '+fmt(n*sel+Math.max(0,n-1)*rest)+' in total</p>'+l.map(function(id,i){return dRow(dr(id),i)}).join('')+'<button class="go" style="margin-top:8px" onclick="startPractice()">Start practice</button>'+(p.my?'<div class="vctl" style="margin-top:8px"><button class="ghost" onclick="editP()">Edit</button><button class="ghost" onclick="delP()">Delete</button></div>':'')+'</div>'}
function startPractice(){var p=allP().filter(function(x){return x.id===pr})[0];p={n:p.n,l:p.l.filter(dr)};pc={p:p,i:0,secs:sel,b0:sum(0),lb:lvl(sum(startOfMonth())).i};pNext()}
function newP(){bld={id:'my'+Date.now(),n:'',l:[],e:'⭐',my:1,d:'My custom practice'};render();scrollTo(0,0)}
function favP(){bld={id:'my'+Date.now(),n:'My favorites',l:favs.filter(dr),e:'⭐',my:1,d:'Made from my favorite drills'};render();scrollTo(0,0)}
function editP(){bld=JSON.parse(JSON.stringify(allP().filter(function(x){return x.id===pr})[0]));render()}
function delP(){mine=mine.filter(function(x){return x.id!==pr});pr=null;render()}
function bm(i,dx){i=+i;if(!dx)bld.l.splice(i,1);else{var j=i+dx;if(j>=0&&j<bld.l.length){var t=bld.l[i];bld.l[i]=bld.l[j];bld.l[j]=t}}render()}
function ba(id){bld.l.push(id);render()}
function saveP(){if(!bld.n.trim()){toast('Give your practice a name.');return}if(!bld.l.length){toast('Add at least one drill.');return}bld.n=bld.n.trim();var i=-1;mine.forEach(function(m,k){if(m.id===bld.id)i=k});if(i>-1)mine[i]=bld;else mine.unshift(bld);pr=bld.id;bld=null;render();toast('Practice saved')}
function bldView(){var sm=function(a){return'style="color:var(--ink)" data-i="'+a+'"'};return'<button class="back" onclick="bld=null;render()">‹ Cancel</button><div class="detail"><h2>Build a practice</h2><input style="'+INP+'" placeholder="Practice name" value="'+esc(bld.n)+'" oninput="bld.n=this.value" aria-label="Practice name"><h3 class="need">Your drills ('+bld.l.length+')</h3>'+(bld.l.length?bld.l.filter(dr).map(function(id,i){return'<div class="row"><div class="drill" style="padding:8px 12px"><h3 style="font-size:19px">'+(i+1)+'. '+dr(id).n+'</h3></div><button class="star" '+sm(i)+' onclick="bm(this.dataset.i,-1)" aria-label="Move up">↑</button><button class="star" '+sm(i)+' onclick="bm(this.dataset.i,1)" aria-label="Move down">↓</button><button class="star" '+sm(i)+' onclick="bm(this.dataset.i,0)" aria-label="Remove">✕</button></div>'}).join(''):'<p style="color:var(--mute)">Add drills below.</p>')+'<h3 class="need">Add drills</h3>'+chips(TOPICS,bt,'bt')+DRILLS.filter(function(d){return bt==='fav'?favs.indexOf(d.id)>-1:d.k===bt}).map(function(d){return'<div class="row"><div class="drill" style="padding:8px 12px"><h3 style="font-size:19px">'+d.n+'</h3></div><button class="star" style="color:var(--ink)" data-id="'+d.id+'" onclick="ba(this.dataset.id)" aria-label="Add drill">+</button></div>'}).join('')+'<button class="go" style="margin-top:10px" onclick="saveP()">Save practice</button></div>'}
function tone(f,d){try{var a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=.15;o.start();o.stop(a.currentTime+d)}catch(e){}}
function unlock(){try{if(wlk){wlk.release();wlk=null}}catch(e){}}
function runT(o){clearInterval(tm);var el=$('timer'),n=3;el.className='timer on';try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wlk=l}).catch(function(){})}catch(e){}function go(){var T=o.secs,C=2*Math.PI*115,z=o.extra?190:260;rt={paused:false,left:T*1000,end:Date.now()+T*1000,half:false};el.innerHTML='<h2 style="font-size:30px">'+o.title+'</h2><div class="ring" style="width:'+z+'px;height:'+z+'px"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="115" fill="none" stroke="var(--line)" stroke-width="14"/><circle id="arc" cx="130" cy="130" r="115" fill="none" stroke="var(--gold)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="0"/></svg><div class="n" id="num">'+T+'</div></div>'+(o.extra||'')+'<div style="display:flex;gap:8px"><button class="ghost" id="pz" onclick="pauseT()">Pause</button><button class="ghost" onclick="stopDrill()">End</button></div>';tm=setInterval(function(){if(rt.paused)return;var left=Math.max(0,rt.end-Date.now());rt.left=left;$('num').textContent=Math.ceil(left/1000);$('arc').setAttribute('stroke-dashoffset',C*(1-left/(T*1000)));if(!rt.half&&T>=30&&left<=T*500){rt.half=true;tone(520,.15)}if(left<=0){clearInterval(tm);unlock();o.onDone()}},200)}el.innerHTML='<h2 style="font-size:30px">'+o.title+'</h2><div class="big" id="cd" style="font-size:120px">3</div><button class="ghost" onclick="stopDrill()">Cancel</button>';tone(660,.12);tm=setInterval(function(){n--;if(n<=0){clearInterval(tm);tone(880,.3);go()}else{$('cd').textContent=n;tone(660,.12)}},1000)}
function pauseT(){if(!rt)return;var b=$('pz');if(rt.paused){rt.end=Date.now()+rt.left;rt.paused=false;b.textContent='Pause'}else{rt.left=Math.max(0,rt.end-Date.now());rt.paused=true;b.textContent='Resume'}}
function stopDrill(){clearInterval(tm);unlock();rt=null;pc=null;$('timer').className='timer';render()}
function startDrill(){var d=dr(open),s=sel;runT({title:d.n,secs:s,onDone:function(){finish(d,s)}})}
function pRun(){var d=dr(pc.p.l[pc.i]);runT({title:d.n,secs:pc.secs,onDone:function(){beep();log.push({t:Date.now(),s:pc.secs,d:d.id});save();pc.i++;if(pc.i<pc.p.l.length){if(rest>0)restT();else pNext()}else pDone()}})}
function restT(){var n=rest,nx=dr(pc.p.l[pc.i]);clearInterval(tm);$('timer').innerHTML='<small style="color:var(--mute)">Rest</small><div class="big" id="cd" style="font-size:110px">'+n+'</div><p style="margin:0">Next: '+nx.n+'</p><button class="go" style="max-width:320px" onclick="clearInterval(tm);pNext()">Skip rest</button><button class="ghost" onclick="stopDrill()">End practice</button>';tm=setInterval(function(){n--;$('cd').textContent=n;if(n<=0){clearInterval(tm);tone(660,.2);pNext()}},1000)}
function tRun(){var t=tc.t;tc.count=0;runT({title:t.n,secs:t.secs,extra:'<div class="big" style="font-size:56px" id="cnt">0</div><button class="go" style="max-width:340px;padding:30px 16px;font-size:32px" onclick="tAdj(1)">Tap: +1 '+t.unit+'</button>',onDone:function(){beep();tDone()}})}
function finish(d,secs){
clearInterval(tm);beep();
var before=sum(0),lb=lvl(sum(startOfMonth())).i;
log.push({t:Date.now(),s:secs,d:d.id});save();
var after=sum(0),la=lvl(sum(startOfMonth()));
var nb=BADGES.filter(function(b){return before<b[0]*60&&after>=b[0]*60});
var el=$("timer");
el.innerHTML='<div class="done"><div style="font-size:64px">'+(nb.length?nb[0][2]:"✅")+'</div><div class="big">+'+secs+' sec</div><p>'+d.n+' complete.</p>'+(la.i>lb?'<p><b>Level up! You’re now '+la.name+'.</b></p>':"")+(nb.length?'<p><b>New badge: '+nb.map(function(b){return b[1]}).join(", ")+'</b></p>':"")+'</div><button class="go" style="max-width:320px" onclick="$(\'timer\').className=\'timer\';render()">Back to drill</button>';
render()}
render();
</script>
