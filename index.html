<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4fd8">
  <meta name="description" content="Soccer drills, practices and skill tests with goals, streaks and badges.">
  <title>Touch Time – Soccer Drills</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Opening animation: field lines draw in, the ball rolls in and the
       ring sweeps round it, then the name rises. Run by js/core/intro.js. -->
  <div class="intro" id="intro" aria-hidden="true">
    <svg class="intro-field" id="intro-field"></svg>
    <div class="intro-center">
      <div class="intro-logo">
        <svg class="intro-ring" viewBox="0 0 100 100">
          <circle class="track" cx="50" cy="50" r="45"/>
          <circle class="sweep" cx="50" cy="50" r="45" pathLength="1" transform="rotate(-90 50 50)"/>
        </svg>
        <div class="intro-roll"><svg class="intro-ball" viewBox="0 0 100 100"><clipPath id="intro-bc"><circle cx="50" cy="50" r="36"/></clipPath><circle cx="50" cy="50" r="36" fill="#fff"/><g clip-path="url(#intro-bc)" fill="#0d1a3a"><polygon points="63.5,31.4 59.1,17.7 70.7,9.2 82.4,17.7 77.9,31.4"/><polygon points="71.9,57.1 83.6,48.7 95.2,57.1 90.7,70.8 76.4,70.8"/><polygon points="50.0,73.0 61.6,81.5 57.2,95.2 42.8,95.2 38.4,81.5"/><polygon points="28.1,57.1 23.6,70.8 9.3,70.8 4.8,57.1 16.4,48.7"/><polygon points="36.5,31.4 22.1,31.4 17.6,17.7 29.3,9.2 40.9,17.7"/><g stroke="#0d1a3a" stroke-width="1.3" stroke-linecap="round"><line x1="50.0" y1="37.0" x2="50.0" y2="27.7"/><line x1="62.3" y1="46.0" x2="71.2" y2="43.1"/><line x1="57.6" y1="60.5" x2="63.1" y2="68.1"/><line x1="42.4" y1="60.5" x2="36.9" y2="68.1"/><line x1="37.7" y1="46.0" x2="28.8" y2="43.1"/></g><polygon points="50.0,37.0 62.3,46.0 57.6,60.5 42.4,60.5 37.7,46.0"/></g><circle cx="50" cy="50" r="36" fill="none" stroke="#0d1a3a" stroke-width="1.4"/></svg></div>
      </div>
      <div class="intro-name">
        <span class="intro-word"><i>T</i><i>O</i><i>U</i><i>C</i><i>H</i></span>
        <span class="intro-word"><i>T</i><i>I</i><i>M</i><i>E</i></span>
      </div>
    </div>
  </div>
  <script src="js/core/intro.js"></script>

  <main id="app"></main>
  <div class="timer" id="timer" role="dialog" aria-label="Drill timer"></div>
  <div class="toast" id="toast" role="status"></div>

  <!-- Content -->
  <script src="js/data/rewards.js"></script>
  <script src="js/data/drills.js"></script>
  <script src="js/data/tests.js"></script>
  <script src="js/data/practices.js"></script>

  <!-- Core -->
  <script src="js/core/util.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/stats.js"></script>
  <script src="js/core/demo.js"></script>
  <script src="js/core/timer.js"></script>
  <script src="js/core/cloud.js"></script>
  <script src="js/core/scrollrow.js"></script>

  <!-- Pages -->
  <script src="js/views/common.js"></script>
  <script src="js/views/drills.js"></script>
  <script src="js/views/practices.js"></script>
  <script src="js/views/tests.js"></script>
  <script src="js/views/rewards.js"></script>
  <script src="js/views/account.js"></script>

  <!-- Wiring -->
  <script src="js/sessions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
